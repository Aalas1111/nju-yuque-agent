[project]
name = "yuque-agent"
version = "0.0.0"
description = "让 LLM 全权接管一个语雀知识库：程序只做感知与留痕，判断权归 LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "NOVA Contributors" }]
keywords = ["yuque", "语雀", "agent", "llm", "agent-safety"]

dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
    # tzdata —— 把时区钉死在 Asia/Shanghai（见 clock.py）。
    #   Linux 上 zoneinfo 用系统 /usr/share/zoneinfo，它用不上；
    #   但 Windows 没有系统 IANA 库，没它就 import 就炸。加上它，两边行为一致。
    "tzdata>=2024.1",
]

# QQ 桥（原 yqa qq …）已拆到它自己的仓库（见 docs/interface.md）：
# cryptography / qrcode / websockets 这些依赖随它搬走，核心不再需要。

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
yqa = "yuque_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "scripts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
